[project]
site_url = "https://abaq-docs.github.io/docs/"
site_name = "ABAQ — Documentación"
site_description = "Documentación técnica y operativa de la plataforma ABAQ de gestión de servicio social."
site_author = "Equipo de Desarrollo ABAQ"

copyright = "Copyright &copy; 2026 ABAQ"

# repo_url = "https://github.com/abaq-docs/docs"
# repo_name = "abaq-docs/docs"
# edit_uri = "edit/main/docs/"

nav = [
  { "Inicio" = "index.md" },
  { "Arquitectura" = "architecture.md" },
  { "Requisitos del sistema (SRS)" = "srs.md" },
  { "Tareas y progreso" = "tasks.md" },
  { "Guía de lectura del código" = "codebase-reading-guide.md" },
  { "Reportes" = [
    { "Índice" = "reports/index.md" },
    { "Reporte No. 2 — v1.1.0" = "reports/report2-2026-09-09.md" },
  ]},
]

[project.theme]
language = "es"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

# logo = "assets/logo.png"

# [project.theme.font]
# text = "Inter"
# code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Cambiar a modo claro"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Cambiar a modo oscuro"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Usar preferencia del sistema"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
