[project]
site_name = "ABAQ — Documentación"
site_url = "https://proyecto-web-abaq.github.io/documentation/"
site_description = "Documentación técnica y operativa de la plataforma ABAQ de gestión de servicio social."
site_author = "Equipo de Desarrollo ABAQ"

copyright = "Copyright &copy; 2026 ABAQ"

repo_url = "https://github.com/proyecto-web-abaq/docs"
repo_name = "proyecto-web-abaq/docs"
edit_uri = "edit/main/docs/"

nav = [
  { "Inicio" = "index.md" },
  { "Manuales" = [
    { "Índice" = "guias/index.md" },
    { "Usuario" = [
      { "Manual de usuario" = "guias/usuario/index.md" }
    ]},
    { "Desarrollo" = [
      { "Guía de entorno" = "guias/desarrollo/index.md" }
    ]}
  ]},
  { "Documentación Técnica" = [
    { "Índice" = "technical/index.md" },
    { "Arquitectura" = "technical/architecture.md" },
    { "Requisitos (SRS)" = "technical/srs.md" },
    { "Tareas y progreso" = "technical/tasks.md" },
  ]},
  { "Reportes" = [
      { "Índice" = "reports/index.md" },
      { "Reporte No. 1" = "reports/report1-2026-08-19/report1.md" },
      { "Reporte No. 2" = "reports/report2-2026-09-09/report2.md" },
    ]}
]

[project.theme]
language = "es"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

# logo = "assets/logo.png"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Cambiar a modo claro"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Cambiar a modo oscuro"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Usar preferencia del sistema"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
